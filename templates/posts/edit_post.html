{% extends "base.html" %}
{% load widget_tweaks %}  <!--form input-->
{% block content %}

    <h1 class="text-center mb-4">edit</h1>

    <form action="{% url 'posts:edit_post' post.id %}" method="POST" enctype="multipart/form-data">
    {% csrf_token %}

        <div class="form-group row">
            {{ form.user }}
        </div>

        <div class="form-group row">
            <label for="stuff">Stuff</label>
            
            {{ form.stuff }}
            
        </div>

        <div class="form-group row">
            <label for="title">Title</label>
            {{ form.title }}
        </div>
        <div class="form-group row">
            <label for="status">Status</label>
            {{ form.status }}
        </div>
        <div class="form-group row">
            <label for="type">Type</label>
            {{ form.type }}
        </div>
        <div class="form-group row">
            <label for="issue_date">Issue_date</label>
            {{ form.issue_date }}
        </div>
        <div class="form-group row">
            <label for="due_date">Due_date</label>
            {{ form.due_date }}
        </div>
        <div class="form-group row" >
            <label for="content">Content</label>
            {{ form.content }}
        </div>
        <div class="form-group row">
            <label for="reward">Reward</label>
            {{ form.reward }}
        </div>

        <button class="btn btn-primary w-100" type="submit">submit</button>

    </form>



{% endblock %}
