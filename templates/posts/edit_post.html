{% extends "base.html" %}
{% load widget_tweaks %}  <!--form input-->
{% block content %}
<div class="container">
    <h2 class="display-5"><span class="material-symbols-outlined" style="font-size: 40px;">edit_document</span> Edit Post Info</h2>

    <form action="{% url 'posts:edit_post' post.id %}" method="POST" enctype="multipart/form-data">
    {% csrf_token %}

        <div class="form-group row">
            {{ form.user }}
        </div>

        <div class="form-group row">
            <label for="stuff" class="col-sm-2 col-form-label font-weight-bold">Select Stuff :</label>
            <div class="col-sm-10">
                {{ form.stuff }}
            </div>
        </div>

        <div class="form-group row">
            <label for="title" class="col-sm-2 col-form-label font-weight-bold">Title</label>
            <div class="col-sm-10">
                {{ form.title }}
            </div>
        </div>

        <div class="form-group row">
            <label for="status" class="col-sm-2 col-form-label font-weight-bold">Status</label>
            <div class="col-sm-10">
                {{ form.status }}
            </div>
        </div>

        <div class="form-group row">
            <label for="type" class="col-sm-2 col-form-label font-weight-bold">Type</label>
            <div class="col-sm-10">
                {{ form.type }}
            </div>
        </div>

        <div class="form-group row">
            <label for="due_date" class="col-sm-2 col-form-label font-weight-bold">Due_date</label>
            <div class="col-sm-10">
                {{ form.due_date }}
            </div>
        </div>

        <div class="form-group row" >
            <label for="content" class="col-sm-2 col-form-label font-weight-bold">Content</label>
            <div class="col-sm-10">
                {{ form.content }}
            </div>
        </div>

        <div class="form-group row">
            <label for="reward" class="col-sm-2 col-form-label font-weight-bold">Reward</label>
            <div class="col-sm-10">
                {{ form.reward }}
            </div>
        </div>

        <button class="btn btn-primary w-100" type="submit">submit</button>

    </form>
    <br>
</div>


{% endblock %}
