{% extends "base.html" %}
{% block content %}
{% load humanize %}

<div class="container">
     <h2 class="display-5"><span class="material-symbols-outlined" style="font-size: 40px;">box_add</span> Feedback</h2>


    <form action="{%url 'feedbacks:create_feedback'%}" method="POST" >
        {% csrf_token %}
        <input type="hidden" name="user_id" value="{{user.id}}"><br>


        <div class="form-group row">
            <label for="title" class="col-sm-2 col-form-label">Title:</label>
            <div class="col-sm-10">
                <input type="text" class="form-control" id="title" name="title" placeholder="Enter Title" required>
            </div>
        </div>

        
        <div class="from-group row">
            <label for="content" class="col-sm-2 col-form-label font-weight-bold">Content</label>
            <div class="col-sm-10">
                <textarea name="content" id="content" class="form-control" cols="30" rows="10" required></textarea>
            </div>
        </div>


        <br>
    
        <hr>
        <button class="btn btn-primary w-100" type="submit"><b>submit<b></button>
    </form>
    <br>
    <br>
</div>



{% endblock %}
