{% extends "base.html" %}
{% block content %}
{% load humanize %}

<div class="container">
     <h2 class="display-5"><span class="material-symbols-outlined" style="font-size: 40px;">box_add</span> Create Stuff Info</h2>


    <form action="{%url 'stuffs:create_stuffs'%}" method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <input type="hidden" name="user_id" value="{{user.id}}"><br>

        <div class="form-group row">
            <label for="name" class="col-sm-2 col-form-label font-weight-bold">Name</label>
            <div class="col-sm-10">
                <input type="text" class="form-control" name="name" id="name" placeholder="Enter stuff name" required>
            </div>
        </div>

        <div class="form-group row">
            <label for="type" class="col-sm-2 col-form-label font-weight-bold">Type</label>
            <div class="col-sm-10">
                <select name="type" class="form-control" >
                    {% for key,value in type.items %}
                        <option value="{{key}}" {% if values.type == key %} selected="true" {% endif %}>{{value}}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="form-group row">
            <label for="district" class="col-sm-2 col-form-label font-weight-bold">Missing District</label>
            <div class="col-sm-10">
                <select name="district" class="form-control">
                    {% for key,value in district_choices.items %}
                        <option value="{{key}}" {% if values.district == key %} selected="true" {% endif %}>{{value}}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="form-group row">
            <label for="location" class="col-sm-2 col-form-label font-weight-bold">Missing Location</label>
            <div class="col-sm-10">
                <input type="text" class="form-control" id="location" name="location" placeholder="Enter location" required>
            </div>
        </div>

        <div class="form-group row">
            <label for="missing_date" class="col-sm-2 col-form-label font-weight-bold">Missing Date</label>
            <div class="col-sm-10">
                <input type="datetime-local" id="missing_date" name="missing_date" class="form-control" required>
            </div>
        </div>
        
        <div class="from-group row">
            <label for="description" class="col-sm-2 col-form-label font-weight-bold">Description</label>
            <div class="col-sm-10">
                <textarea name="description" id="description" class="form-control" cols="30" rows="10" required></textarea>
            </div>
        </div>

        <br>
        <div class="from-group row">
            <label for="Photo" class="col-sm-2 col-form-label font-weight-bold">Photo</label>
            <div class="col-sm-10">
                <div class="custom-file row">
                    <input type="file" class="custom-file-input" id="photo" name="photo">
                    <label for="photo" class="custom-file-label">Choose Photo</label>
                </div>
            </div>    
        </div>

        <hr>
        <button class="btn btn-primary w-100" type="submit"><b>submit<b></button>
    </form>
    <br>
    <br>
</div>



{% endblock %}
