{% extends "base.html" %}
{% load widget_tweaks %}  <!--form input-->
{% block content %}

<div class="container">

    <h2 class="display-5"><span class="material-symbols-outlined" style="font-size: 40px;">box_edit</span> Edit Stuff Info</h2>

    <form action="{% url 'stuffs:edit_stuff' stuff.id %}" method="POST" enctype="multipart/form-data">
    {% csrf_token %}

        <div class="form-group row">
            {{ form.user }}
        </div>
         <div class="form-group row">
            <label for="name" class="col-sm-2 col-form-label font-weight-bold">Stuff Name</label>
            <div class="col-sm-10">
                {{ form.name }}
            </div>
        </div>

        <div class="form-group row">
            <label for="type" class="col-sm-2 col-form-label font-weight-bold">Type</label>
            <div class="col-sm-10">
                {{ form.type }}
            </div>
        </div>
        <div class="form-group row">
            <label for="district" class="col-sm-2 col-form-label font-weight-bold">District</label>
            <div class="col-sm-10">
                {{ form.district }}
            </div>    
        </div>

        <div class="form-group row">
            <label for="location" class="col-sm-2 col-form-label font-weight-bold">Location</label>
            <div class="col-sm-10">
                {{ form.location }}
            </div>    
        </div>

        <div class="form-group row">
            <label for="missing_date" class="col-sm-2 col-form-label font-weight-bold">Missing Date</label>
            <div class="col-sm-10">
                {{ form.missing_date }}
            </div>    
        </div>

        <div class="form-group row">
            <label for="photo" class="col-sm-2 col-form-label font-weight-bold">Photo</label>
            <div class="col-sm-10">
                {{ form.photo_main }}
            </div>
        </div>

        <div class="form-group row">
            <label for="description" class="col-sm-2 col-form-label font-weight-bold">description</label>
            <div class="col-sm-10">
                {{ form.description }}
            </div>
        </div>

        <button class="btn btn-primary w-100" type="submit">submit</button>
    </form>

</div>
<br>

{% endblock %}
