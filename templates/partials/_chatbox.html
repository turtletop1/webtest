<style>
.chat-popup {
    display: none;
    bottom: 20px;
    right: 20px;
    z-index: 1050;
    width: 380px; 
    max-height: 520px;
}
    
.open-btn {
    bottom: 20px;
    right: 20px;
    z-index: 1040;
}

.chat-messages {
    height: 250px;
    overflow-y: auto; 
}
</style>

<button class="btn btn-primary btn-lg position-fixed open-btn shadow rounded-circle p-3" onclick="openForm()">
    <i class="bi bi-chat-dots-fill"></i> chat
</button>

<div class="chat-popup position-fixed border-0 rounded-4 bg-white shadow-lg p-3" id="myForm">

    <div class="d-flex justify-content-between align-items-center mb-2 pb-2 border-bottom">
        <h5 class="m-0 fw-bold">chat</h5>

        <button type="button" class="btn-close" onclick="closeForm()"></button>
    </div>

    <div class="row">

        <div class="col-3 border-end pe-2">
            <div class="text-muted extra-small fw-bold mb-2">SENDER</div>
            <div class="p-1 bg-light rounded text-truncate small fw-bold text-primary">

                
            </div>
        </div>


        <div class="col-9">
            <div class="chat-messages bg-light rounded p-2 mb-3">
                <div class="text-muted small text-center my-2">record</div>

                {% for msg_user in msg_users %}
                    <div class="bg-primary text-white p-2 rounded mb-2 w-75 ms-auto small text-break">
                        {{ msg_user.content }}
                        <div class="text-end extra-small opacity-75" style="font-size: 0.7rem;">
                            {{ msg_user.date|date:"H:i" }}
                        </div>
                    </div>
                {% empty %}
                    <div class="text-muted small text-center my-auto">no reccord</div>
                {% endfor %}
            </div>

            <form action="#" method="POST">
                {% csrf_token %}
                <div class="row g-2">
                    <div class="col-9">
                      

                        <textarea class="form-control form-control-sm bg-light" id="msg" name="msg" rows="2" placeholder="send..." style="resize: none;" required></textarea>
                    </div>
                    <div class="col-3 d-flex align-items-end">
                        <button type="submit" class="btn btn-primary btn-sm w-100 h-100">send</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

</div>

<script>
    function openForm() {
        document.getElementById("myForm").style.display = "block";
    }

    function closeForm() {
        document.getElementById("myForm").style.display = "none";
    }
</script>
